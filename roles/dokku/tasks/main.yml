---
- name: Stop the Dokku package importing root's SSH key
  ansible.builtin.debconf:
    name: dokku
    question: dokku/skip_key_file
    vtype: boolean
    value: "true"

- name: Add Dokku's apt repository
  ansible.builtin.deb822_repository:
    name: dokku
    uris: https://packagecloud.io/dokku/dokku/ubuntu/
    suites: "{{ ansible_facts.distribution_release }}"
    components: main
    signed_by: https://packagecloud.io/dokku/dokku/gpgkey

- name: Install Dokku
  ansible.builtin.apt:
    name: dokku={{ dokku_version }}
    update_cache: true
  register: dokku_package

# Not a handler: a handler deferred to the end of the play would be skipped if a later
# task failed, and the next run sees an unchanged package and never retries.
- name: Install Dokku's core plugin dependencies  # noqa: no-handler
  ansible.builtin.command: dokku plugin:install-dependencies --core
  when: dokku_package is changed
  changed_when: true

- name: Read the keys Dokku already accepts
  ansible.builtin.slurp:
    src: /home/dokku/.ssh/authorized_keys
  register: dokku_authorized_keys

# Names derive from the key so re-runs and reordering never hit "Duplicate ssh key name".
- name: Register the admin SSH keys with Dokku
  ansible.builtin.command:
    argv: [dokku, "ssh-keys:add", "{{ admin_user }}-{{ (item.split()[1] | hash('sha1'))[:8] }}"]
    stdin: "{{ item }}"
  loop: "{{ admin_ssh_keys }}"
  loop_control:
    label: "{{ item | truncate(30, true) }}"
  when: item.split()[1] not in dokku_authorized_keys.content | b64decode
  changed_when: true

- name: Read Dokku's global domains
  ansible.builtin.command: dokku domains:report --global --domains-global-vhosts
  register: dokku_global_domains
  changed_when: false

- name: Set Dokku's global domain
  ansible.builtin.command:
    argv: [dokku, "domains:set-global", "{{ dokku_global_domain }}"]
  when: dokku_global_domain | length > 0 and dokku_global_domain not in dokku_global_domains.stdout.split()
  changed_when: true

- name: Read the installed Dokku plugins
  ansible.builtin.command: dokku plugin:list --format json
  register: dokku_plugin_list
  changed_when: false
  check_mode: false

- name: Pin Dokku plugins
  vars:
    dokku_installed_plugins: "{{ dokku_plugin_list.stdout | from_json | items2dict(key_name='name', value_name='version') }}"
  block:
    - name: Install missing Dokku plugins
      ansible.builtin.command:
        argv: [dokku, "plugin:install", "{{ item.url }}", --committish, "{{ item.version }}", --name, "{{ item.name }}"]
      loop: "{{ dokku_plugins }}"
      loop_control:
        label: "{{ item.name }} {{ item.version }}"
      when: item.name not in dokku_installed_plugins
      changed_when: true

    # plugin:list reports plugin.toml's version, which Dokku's own plugins bump to match each release tag.
    - name: Move Dokku plugins to their pinned version
      ansible.builtin.command:
        argv: [dokku, "plugin:update", "{{ item.name }}", "{{ item.version }}"]
      loop: "{{ dokku_plugins }}"
      loop_control:
        label: "{{ item.name }} {{ item.version }}"
      when: item.name in dokku_installed_plugins and dokku_installed_plugins[item.name] != item.version
      changed_when: true

- name: Configure Let's Encrypt
  when: "'letsencrypt' in dokku_plugins | map(attribute='name')"
  block:
    - name: Read Let's Encrypt's global settings
      ansible.builtin.command: dokku letsencrypt:report --global --format json
      register: dokku_letsencrypt_report
      changed_when: false
      check_mode: false

    - name: Set Let's Encrypt's global email
      ansible.builtin.command:
        argv: [dokku, "letsencrypt:set", --global, email, "{{ dokku_letsencrypt_email }}"]
      when: dokku_letsencrypt_email | length > 0 and dokku_letsencrypt_email != (dokku_letsencrypt_report.stdout | from_json)['global-email']
      changed_when: true

    - name: Read Let's Encrypt's renewal cron job status
      ansible.builtin.command: dokku letsencrypt:cron-job
      register: dokku_letsencrypt_cron_job
      changed_when: false
      check_mode: false

    - name: Add Let's Encrypt's renewal cron job
      ansible.builtin.command: dokku letsencrypt:cron-job --add
      when: "'cron job is enabled' not in dokku_letsencrypt_cron_job.stdout"
      changed_when: true
