---
- name: Install ufw
  ansible.builtin.apt:
    name: ufw
    update_cache: true
    cache_valid_time: 3600

- name: Read the effective sshd config
  ansible.builtin.command: /usr/sbin/sshd -T
  register: firewall_sshd_config
  changed_when: false

# SSH ports come from sshd itself, not ansible_port, so NAT or a bastion can't cause a lockout.
- name: Allow SSH and the configured TCP ports
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall_sshd_ports + firewall_allowed_tcp_ports }}"
  vars:
    firewall_sshd_ports: "{{ firewall_sshd_config.stdout_lines | select('match', '^port ') | map('split') | map('last') | list }}"

- name: Enable ufw and deny all other incoming traffic
  community.general.ufw:
    state: enabled
    direction: incoming
    policy: deny

- name: Set up fail2ban
  when: firewall_fail2ban
  block:
    - name: Find the address Ansible connects from
      ansible.builtin.shell: echo "$SSH_CONNECTION"
      become: false
      changed_when: false
      register: firewall_ssh_connection

    - name: Create the fail2ban jail directory
      ansible.builtin.file:
        path: /etc/fail2ban/jail.d
        state: directory
        mode: "0755"

    # Written before the package is installed: apt starts fail2ban on install and it
    # scans the existing auth.log, which can ban the address you deploy from.
    - name: Exempt the deploy address from fail2ban
      ansible.builtin.template:
        src: ignoreip.local.j2
        dest: /etc/fail2ban/jail.d/00-ignoreip.local
        mode: "0644"
      vars:
        firewall_deploy_address: "{{ firewall_ssh_connection.stdout.split()[0:1] }}"
      notify: Restart fail2ban

    - name: Install fail2ban
      ansible.builtin.apt:
        name: fail2ban

    - name: Start fail2ban
      ansible.builtin.service:
        name: fail2ban
        state: started
        enabled: true
